name: Loot Forge CI
on:
  push:
    branches: [main]
    paths: ['loot/**', '.github/workflows/loot-ci.yml']
  pull_request:
    paths: ['loot/**', '.github/workflows/loot-ci.yml']
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Validate catalog and salvage/repair recipes
        working-directory: loot
        run: python3 scripts/verify.py
  forge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.8'}
      - name: Build standalone Forge 1.20.1 Loot
        working-directory: loot
        run: gradle clean build --no-daemon --max-workers=1 --stacktrace
      - name: Verify jar includes all 32 item sprites and models
        working-directory: loot
        run: |
          python3 - <<'PY'
          import json,zipfile
          from pathlib import Path
          defs=json.loads(Path("src/main/resources/data/dmzloot/catalog/items.json").read_text(encoding="utf-8"))
          jar=Path("build/libs/project-dmz-loot-0.1.0.jar")
          with zipfile.ZipFile(jar) as z:
              names=set(z.namelist())
              for item in defs:
                  id=item["id"]
                  png="assets/dmzloot/textures/item/"+id+".png"
                  model="assets/dmzloot/models/item/"+id+".json"
                  assert png in names, "Missing sprite "+png
                  assert model in names, "Missing model "+model
                  assert z.read(png).startswith(bytes([137,80,78,71,13,10,26,10])), png
              print(f"Verified {len(defs)} Loot sprites and models in {jar.name}")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: project-dmz-loot-0.1.0
          path: loot/build/libs/*.jar
          if-no-files-found: error
